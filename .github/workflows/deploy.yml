# Checks every pull request and uploads a Cloudflare preview. Deploys when main changes.
# Repository secret: CLOUDFLARE_API_TOKEN. Repository variables (optional): POSTHOG_KEY,
# POSTHOG_HOST, CONTACT_EMAIL. They are read at build time only; none is shipped as browser env.
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build
        env:
          POSTHOG_KEY: ${{ vars.POSTHOG_KEY }}
          POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}

      # Pull requests: a preview version with its own workers.dev URL. Allowed to fail so a
      # missing Cloudflare token cannot block review.
      - name: Upload a Cloudflare preview
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: versions upload --preview-alias pr-${{ github.event.number }}

      - name: Deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy
